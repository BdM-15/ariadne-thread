[project]
name = "ariadne-thread"
version = "0.1.0"
description = "Python-first capture command center platform for Shipley-aligned pursuits."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
