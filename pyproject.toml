[project]
name = "ariadne-thread"
version = "0.1.0"
description = "Python-first capture command center platform for Shipley-aligned pursuits."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
